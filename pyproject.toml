[project]
name = "smartfactory-iot-assignment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "paho-mqtt>=1.6.1",
    "aiocoap>=0.4.7",
    "pika>=1.3.2",
    "influxdb-client>=1.38.0",
    "pytest==9.0.3",
    "pytest-asyncio==0.21.2",
    "pytest-timeout>=2.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
